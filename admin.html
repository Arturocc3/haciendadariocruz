<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Aprobar reserva · Hacienda Dario Cruz</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Inter,system-ui,Arial,sans-serif;background:#F0FAFD;color:#08465F;padding:22px 16px;line-height:1.5}
  .card{max-width:460px;margin:0 auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 24px rgba(11,110,143,.15)}
  .brand{color:#0B6E8F;font-weight:700;margin-bottom:6px}
  h1{font-size:1.45rem;margin-bottom:14px}
  .info{background:#F0FAFD;border-radius:14px;padding:14px 16px;margin-bottom:16px}
  .info b{font-size:1.05rem}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:.95rem;margin-top:4px}
  .tag{display:inline-block;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700;margin-bottom:12px}
  .pend{background:#FFF4E0;color:#9a6a12}.okc{background:#E3F6EA;color:#1a7a3d}
  button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:17px;font:inherit;font-size:1.08rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;margin-top:12px;color:#fff}
  .ap{background:#1a9b4b}.rj{background:#c0392b}.wa{background:#25D366}
  button:disabled{opacity:.5}
  .muted{color:#5b7782;font-size:.88rem;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="card" id="c"><p class="brand">🌴 Hacienda Dario Cruz</p><h1>Cargando reserva…</h1></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxL-NTxfaqqon9Z32Kg2B-HBBuRwK8ZF33A8CZ4vCK_k1t5pBQ4wVIcFr-8bwkpJMJmBQ/exec';
const q = new URLSearchParams(location.search);
const id = q.get('id') || '', t = q.get('t') || '', want = q.get('a');
const c = document.getElementById('c');
const money = n => 'RD$' + Number(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
const head = '<p class="brand">🌴 Hacienda Dario Cruz</p>';
let R = null;

async function call(params) {
  const r = await fetch(API + '?' + new URLSearchParams(Object.assign({ id, t }, params)) + '&_=' + Date.now());
  return r.json();
}
function infoBox(r) {
  return '<div class="info"><b>📅 ' + esc(r.dateText) + '</b>' +
    '<div class="row"><span>👤 ' + esc(r.name) + '</span><span>👥 ' + esc(r.people) + ' pers.</span></div>' +
    '<div class="row"><span>📞 ' + esc(r.phone) + '</span><span>💵 ' + esc(r.pay) + '</span></div>' +
    '<div class="row"><span>Total ' + money(r.total) + '</span><span><b>50%: ' + money(r.deposit) + '</b></span></div></div>';
}
function waBtn(phone, text, label) {
  return '<a class="btn wa" href="https://wa.me/' + esc(phone) + '?text=' + encodeURIComponent(text) + '">💬 ' + label + '</a>';
}
async function load() {
  try { R = await call({ action: 'info' }); } catch (e) { R = { ok: false, error: 'No hay conexión. Intenta de nuevo.' }; }
  if (!R.ok) { c.innerHTML = head + '<h1>Reserva no encontrada</h1><p>' + esc(R.error || '') + '</p>'; return; }
  const pending = R.status === 'pending';
  let h = head + '<h1>' + (pending ? '¿Aprobar o rechazar?' : 'Reserva aprobada ✅') + '</h1>' +
    '<span class="tag ' + (pending ? 'pend' : 'okc') + '">' + (pending ? '⏳ Pendiente de pago' : '✅ Reservado') + '</span>' + infoBox(R);
  if (pending) {
    h += '<button class="ap" id="ap">✅ APROBAR (recibí el pago)</button>' +
         '<button class="rj" id="rj">❌ RECHAZAR y liberar la fecha</button>' +
         '<p class="muted">Si no haces nada, la fecha se libera sola a las 24 horas.</p>';
  } else {
    h += '<button class="rj" id="rj">❌ Cancelar esta reserva y liberar la fecha</button>';
  }
  c.innerHTML = h;
  const ap = document.getElementById('ap'), rj = document.getElementById('rj');
  if (ap) { ap.onclick = () => decide('approve'); if (want === 'approve') ap.style.outline = '4px solid #9be0b4'; }
  if (rj) { rj.onclick = () => decide('reject'); if (want === 'reject') rj.style.outline = '4px solid #f2b3ab'; }
}
async function decide(what) {
  if (what === 'reject' && !confirm('¿Seguro que quieres RECHAZAR y liberar la fecha?')) return;
  c.querySelectorAll('button').forEach(b => b.disabled = true);
  let r;
  try { r = await call({ action: 'decide', do: what }); } catch (e) { r = { ok: false, error: 'No hay conexión. Intenta de nuevo.' }; }
  if (!r.ok) { alert(r.error || 'Error'); load(); return; }
  if (r.done === 'approved') {
    c.innerHTML = head + '<h1>✅ Reserva aprobada</h1>' + infoBox(R) + '<p>La fecha quedó <b>ocupada</b> en el calendario.</p>' +
      waBtn(r.phone, r.waText, 'Enviar confirmación al cliente');
  } else {
    c.innerHTML = head + '<h1>❌ Reserva rechazada</h1>' + infoBox(R) + '<p>La fecha quedó <b>libre</b> otra vez.</p>' +
      waBtn(r.phone, r.waText, 'Avisar al cliente por WhatsApp');
  }
}
if (!id || !t) c.innerHTML = head + '<h1>Enlace incompleto</h1><p>Abre el enlace completo que te llegó por correo.</p>';
else load();
</script>
</body>
</html>
